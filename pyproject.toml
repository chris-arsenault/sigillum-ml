[project]
name = "sigillum-ml"
version = "0.1.0"
description = "Theme generation, ML experiments, and corpus tooling for Sigillum."
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
    "music21>=9",
    "numpy>=1.26",
    "pretty_midi>=0.2.10",
    "torch>=2",
]

[project.optional-dependencies]
dev = [
    "mlflow>=2",
    "pytest>=8",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".", "../sigillum-library", "../sigillum"]
testpaths = ["tests"]
